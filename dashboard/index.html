<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llm-bench · results</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  td, th { border: 1px solid #ccc; padding: .4rem .6rem; text-align: right; }
  td:first-child, th:first-child { text-align: left; }
  .webgpu { color: #06c; }
  textarea { width: 100%; min-height: 14rem; font-family: monospace; font-size: .85rem; }
  .row { display: flex; gap: .5rem; margin: .5rem 0; }
  #msg { color: #555; }
</style>
</head>
<body>
<h1>llm-bench — results</h1>
<table id="table">
  <thead>
    <tr>
      <th>date</th><th>backend</th><th>device</th><th>model</th>
      <th>pp best</th><th>pp med</th><th>tg best</th><th>tg med</th><th>ttft ms</th>
      <th>gpu probe (GFMA/s)</th><th>file</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<h2>Submit a result</h2>
<p>Paste a result JSON (copy button on the bench page) and give it a filename
like <code>2026-07-09-rtx4090.json</code>.</p>
<div class="row">
  <input id="fname" style="flex:1" placeholder="2026-07-09-device.json">
  <input id="token" style="flex:1" type="password" placeholder="gitea token (optional; local write only if empty)">
  <button id="submit">Save</button>
</div>
<textarea id="body" placeholder="{ …result json… }"></textarea>
<div id="msg"></div>

<script>
const fmt = (v) => v == null ? "—" : Math.round(v * 10) / 10;
const probe = (r) => r.compat?.probe?.fma_per_s_best ? fmt(r.compat.probe.fma_per_s_best / 1e6) : "—";

async function load() {
  const files = await (await fetch("/api/results")).json();
  const rows = [];
  for (const f of files) {
    try {
      const r = await (await fetch("/results/" + encodeURIComponent(f))).json();
      rows.push({ f, r });
    } catch {}
  }
  rows.sort((a, b) => (a.r.date || "").localeCompare(b.r.date || ""));
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";
  for (const { f, r } of rows) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.date || "—"}</td>
      <td class="${r.backend === "webgpu" ? "webgpu" : ""}">${r.backend || "?"}</td>
      <td>${r.device || "—"}</td>
      <td>${r.model || "—"}</td>
      <td>${fmt(r.pp?.best)}</td><td>${fmt(r.pp?.median)}</td>
      <td>${fmt(r.tg?.best)}</td><td>${fmt(r.tg?.median)}</td>
      <td>${r.ttft_ms ?? "—"}</td>
      <td>${probe(r)}</td>
      <td><a href="/results/${encodeURIComponent(f)}" target="_blank">${f}</a></td>`;
    tbody.appendChild(tr);
  }
}

document.getElementById("submit").onclick = async () => {
  const msg = document.getElementById("msg");
  try {
    const body = JSON.parse(document.getElementById("body").value); // validates
    const res = await fetch("/api/results", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        filename: document.getElementById("fname").value.trim(),
        token: document.getElementById("token").value.trim(),
        content: body,
      }),
    });
    const j = await res.json();
    msg.textContent = res.ok ? "saved: " + j.path : "error: " + j.error;
    if (res.ok) load();
  } catch (e) { msg.textContent = "error: " + e.message; }
};

load();
</script>
</body>
</html>
