<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llm-bench · WebGPU</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.1rem; margin-top: 1.5rem; }
  .row { display: flex; gap: .5rem; align-items: center; margin: .75rem 0; flex-wrap: wrap; }
  button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
  pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; min-height: 1rem; white-space: pre-wrap; word-break: break-all; }
  table { border-collapse: collapse; }
  td, th { border: 1px solid #ccc; padding: .4rem .8rem; }
  #status { color: #555; }
  .ok { color: #0a0; font-weight: bold; }
  .bad { color: #a00; font-weight: bold; }
</style>
</head>
<body>
<h1>llm-bench — WebGPU</h1>
<p>Pure static page: WebGPU compatibility + raw GPU throughput probe, then a
llama-bench-style model benchmark (llama.cpp-web, wasm + WebGPU).</p>

<div class="row">
  <button id="compat">1 · Check WebGPU</button>
  <label>Model <select id="model" style="min-width:220px"></select></label>
  <button id="run">2 · Run model bench</button>
</div>
<div id="status">loading…</div>

<h2>WebGPU compatibility</h2>
<pre id="compat-out">—</pre>

<h2>Model benchmark</h2>
<table id="table" style="display:none">
  <tr><th></th><th>best</th><th>median</th></tr>
  <tr><td>pp (tok/s, 256 tok)</td><td id="pp-best"></td><td id="pp-med"></td></tr>
  <tr><td>tg (tok/s, 128 tok)</td><td id="tg-best"></td><td id="tg-med"></td></tr>
  <tr><td>ttft (ms)</td><td id="ttft" colspan="2"></td></tr>
</table>

<h2>Result JSON <button id="copy">copy</button></h2>
<pre id="json">—</pre>

<script type="module">
import { init, initModel, createContext } from "https://cdn.jsdelivr.net/npm/@ggml-org/llama.js@0.8.9/dist/llama.js";

const $ = (id) => document.getElementById(id);
const now = () => performance.now();
const median = (a) => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
let COMPAT = null;   // filled by step 1, merged into the result JSON

// ── model list ───────────────────────────────────────────────
let MODELS = [];
try { MODELS = await (await fetch("models/list.json")).json(); } catch {}
for (const m of MODELS) {
  const o = document.createElement("option");
  o.value = "models/" + m.file; o.textContent = m.file;
  $("model").appendChild(o);
}
$("status").textContent = MODELS.length ? "ready" : "no models in web/models/ — run web/models/fetch-model.sh";

// ── 1 · WebGPU compatibility + raw throughput probe ──────────
// Fixed-size WGSL compute kernel: every thread runs 1024 dependent FMAs.
// Throughput (FMA/s) is a crude hardware number — it's what lets you
// compare devices in the dashboard without loading a model.
const PROBE_THREADS = 1024 * 256;   // 256 dispatches × 256 threads
const PROBE_FMAS = 1024;
const PROBE_ITERS = 3;
const PROBE_WGSL = `
@group(0) @binding(0) var<storage, read_write> data: array<f32>;
@compute @workgroup_size(256,1,1)
fn main(@builtin(global_invocation_index) gid: u32) {
  var x = f32(gid) * 0.000977;
  for (var i = 0u; i < ${PROBE_FMAS}u; i++) { x = x * 1.000001 + 0.000001; }
  data[gid] = x;
}`;

async function checkWebGPU() {
  const status = (s) => { $("status").textContent = s; };
  const out = { webgpu: false };

  if (!navigator.gpu) {
    $("compat-out").textContent = "WebGPU: NOT available in this browser";
    COMPAT = out;
    return out;
  }
  out.webgpu = true;
  status("requesting adapter…");
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) {
    $("compat-out").textContent = "WebGPU: no adapter";
    COMPAT = out;
    return out;
  }

  // adapter identity
  try {
    const info = await adapter.requestAdapterInfo();
    Object.assign(out, {
      adapter: info.description || "unknown",
      vendor: info.vendor, architecture: info.architecture, device: info.device,
    });
  } catch {}

  // feature + limit snapshot (the useful ones for inference workloads)
  const features = {};
  for (const f of ["shader-f16", "bfloat16-storage", "float32-filtering"])
    features[f] = adapter.hasFeature(f);
  out.features = features;
  const limits = {};
  for (const l of ["maxStorageBufferBindingSize", "maxComputeWorkgroupsPerUniformRange", "maxStorageBuffersPerShaderStage", "maxComputeInvocationsPerWorkgroup"])
    limits[l] = adapter.limits[l];
  out.limits = limits;

  // raw compute probe
  status("running compute probe…");
  const device = await adapter.requestDevice();
  const module = device.createShaderModule({ code: PROBE_WGSL });
  const pipeline = device.createComputePipeline({
    layout: "auto",
    compute: { module, entryPoint: "main" },
  });
  const buf = device.createBuffer({ size: PROBE_THREADS * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: buf } }],
  });

  const totalFma = PROBE_THREADS * PROBE_FMAS;
  const speeds = [];
  for (let i = 0; i < PROBE_ITERS; i++) {
    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bindGroup);
    pass.dispatchWorkgroups(PROBE_THREADS / 256);
    pass.end();
    const t0 = now();
    await device.queue.submit([enc.finish()]);
    await device.queue.onSubmittedWorkDone();
    speeds.push(totalFma / ((now() - t0) / 1000));
  }
  out.probe = {
    fma_per_s_best: Math.max(...speeds),
    fma_per_s_median: median(speeds),
    threads: PROBE_THREADS, fmas_per_thread: PROBE_FMAS, iters: PROBE_ITERS,
  };

  $("compat-out").textContent = JSON.stringify(out, null, 2);
  COMPAT = out;
  return out;
}
$("compat").onclick = () => checkWebGPU().catch(e => $("compat-out").textContent = "error: " + e.message);

// ── 2 · model benchmark (llama-bench convention) ─────────────
const PP = 256, TG = 128, ITERS = 3;
const PROMPT = "The quick brown fox jumps over the lazy dog. ".repeat(64);

async function runBench(modelUrl) {
  const status = (s) => { $("status").textContent = s; };
  if (!COMPAT) await checkWebGPU();
  if (!COMPAT?.webgpu) throw new Error("WebGPU not available — run step 1 first");

  status("initializing llama.cpp-web…");
  await init({ gpu: true });
  status("loading model…");
  const model = await initModel({ model: { url: modelUrl }, gpu: { splitMode: "layer" } });
  status("creating context…");
  const ctx = await createContext({ model, nCtx: PP + TG + 64, gpu: { splitMode: "layer" } });

  const promptTokens = model.tokenize(PROMPT).slice(0, PP);
  const ppSpeeds = [], tgSpeeds = [];
  let ttft = 0;

  for (let it = 0; it < ITERS; it++) {
    ctx.reset();
    status(`iteration ${it + 1}/${ITERS} — prompt processing…`);
    const t0 = now();
    await ctx.eval(promptTokens);
    ppSpeeds.push(PP / ((now() - t0) / 1000));

    status(`iteration ${it + 1}/${ITERS} — generating ${TG} tokens…`);
    ctx.sample();
    const t1 = now();
    for (let i = 0; i < TG; i++) {
      const tok = ctx.sample();
      await ctx.eval([tok]);
      if (i === 0) ttft = now() - t1;
    }
    tgSpeeds.push(TG / ((now() - t1) / 1000));
  }

  const result = {
    backend: "webgpu",
    compat: COMPAT,
    engine: "llama.cpp-web (llama.js 0.8.9)",
    device: COMPAT.adapter || "unknown",
    model: modelUrl.split("/").pop(),
    params: { pp: PP, tg: TG, iters: ITERS },
    pp:  { best: Math.max(...ppSpeeds), median: median(ppSpeeds) },
    tg:  { best: Math.max(...tgSpeeds), median: median(tgSpeeds) },
    ttft_ms: Math.round(ttft),
    date: new Date().toISOString(),
  };

  $("table").style.display = "";
  $("pp-best").textContent = result.pp.best.toFixed(1);
  $("pp-med").textContent  = result.pp.median.toFixed(1);
  $("tg-best").textContent = result.tg.best.toFixed(1);
  $("tg-med").textContent  = result.tg.median.toFixed(1);
  $("ttft").textContent = result.ttft_ms;
  $("json").textContent = JSON.stringify(result, null, 2);
  $("status").textContent = "done";
  return result;
}

$("run").onclick = () => runBench($("model").value)
  .catch((e) => { $("status").textContent = "error: " + e.message; console.error(e); });
$("copy").onclick = () => navigator.clipboard.writeText($("json").textContent);
</script>
</body>
</html>
